# /etc/nginx/sites-available/flockcam
#
# Terminates TLS and forwards to the loopback-only Node process. The Node
# server already gzips JSON, so nginx must not compress a second time.

limit_req_zone $binary_remote_addr zone=flockcam_api:10m rate=30r/s;

upstream flockcam_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.flockcam.app;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.flockcam.app;

    ssl_certificate     /etc/letsencrypt/live/api.flockcam.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.flockcam.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 1m;
    client_body_timeout 15s;

    gzip off;

    location /api/ {
        limit_req zone=flockcam_api burst=60 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Camera regions can be a few hundred KB; buffering keeps the Node
        # process free while a slow phone finishes downloading.
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        proxy_pass http://flockcam_backend;
    }

    location = /api/health {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
        proxy_pass http://flockcam_backend;
    }

    location / {
        return 404;
    }
}
