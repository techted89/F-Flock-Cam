name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

env:
  KEYSTORE_FILE: release.keystore
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  PLAY_TRACK: ${{ github.event.inputs.track || 'internal' }}

jobs:
  build-release:
    name: Build Release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build release bundle
        run: ./gradlew bundleRelease

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  publish-play:
    name: Publish to Google Play
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Download release AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/

      - name: Install fastlane
        run: sudo gem install fastlane

      - name: Write Play service account key
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_STORE_SERVICE_ACCOUNT_JSON" ]; then
            echo "PLAY_STORE_SERVICE_ACCOUNT_JSON is not configured" >&2
            exit 1
          fi
          printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > play-service-account.json
          chmod 600 play-service-account.json

      - name: Upload AAB to Google Play
        run: |
          fastlane supply \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --json_key play-service-account.json \
            --package_name com.techted89.flockcam \
            --track "$PLAY_TRACK"

      - name: Remove service account key
        if: always()
        run: rm -f play-service-account.json
